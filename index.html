<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastag Balance Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .balance-info {
            margin-top: 20px;
            font-size: 18px;
            color: green;
        }
        .error-message {
            margin-top: 20px;
            font-size: 18px;
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Fastag Balance Check</h2>
    <p>Enter your Fastag number to check balance</p>

    <input type="text" id="fastagNumber" placeholder="Enter Fastag Number" required>
    <button onclick="checkBalance()">Check Balance</button>

    <div id="balanceInfo" class="balance-info"></div>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
    function checkBalance() {
        const fastagNumber = document.getElementById("fastagNumber").value;
        const balanceInfo = document.getElementById("balanceInfo");
        const errorMessage = document.getElementById("errorMessage");

        // Clear previous messages
        balanceInfo.innerHTML = "";
        errorMessage.innerHTML = "";

        if(fastagNumber === "") {
            errorMessage.innerHTML = "Please enter a Fastag number.";
            return;
        }

        // Simulating Fastag balance check with random data (in real case, you need API integration)
        if(fastagNumber === "123456789") {
            // Simulated balance response
            balanceInfo.innerHTML = "Your Fastag Balance is: ₹500.00";
        } else {
            errorMessage.innerHTML = "Invalid Fastag Number. Please try again.";
        }
    }
</script>

</body>
</html>
